<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recargas Free Fire - Dark Premium</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP para animaciones fluidas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        /* Estética Apple Pro - Dark Glassmorphism */
        body { 
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 50%, #111111 100%);
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            min-height: 100vh;
        }
        
        .interfaz-glass {
            background-color: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255,255,255,0.05);
        }

        .package-card { 
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .package-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }
        .package-card.selected { 
            border-color: #38bdf8; 
            background-color: rgba(56, 189, 248, 0.05); 
            box-shadow: 0 0 0 1px #38bdf8, 0 10px 20px -5px rgba(56, 189, 248, 0.15);
        }

        input {
            background-color: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
        }
        input:focus {
            border-color: #38bdf8 !important;
            background-color: rgba(0, 0, 0, 0.5) !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15) !important;
            outline: none;
        }
        input::placeholder {
            color: #52525b; 
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .anim-item {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-6 py-10 relative overflow-x-hidden">

    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-orange-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="interfaz-glass w-full max-w-lg p-6 sm:p-8 rounded-[2rem] anim-item z-10">
        <div class="text-center mb-10 anim-item">
            <!-- Título con gradiente de color estilo Free Fire -->
            <h1 class="text-3xl font-black tracking-tight mb-2 text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-yellow-400 drop-shadow-md">
                Recarga Free Fire
            </h1>
            <p class="text-zinc-400 text-sm font-medium">Ingresa tus datos y selecciona tu paquete</p>
        </div>

        <div class="space-y-7">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="anim-item">
                    <label class="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2 ml-1">ID del Jugador</label>
                    <input type="text" id="playerId" maxlength="12" oninput="this.value = this.value.replace(/[^0-9]/g, '');" 
                           class="w-full rounded-2xl px-4 py-3.5 transition-all text-base font-medium"
                           placeholder="Ej. 123456789">
                </div>
                <div class="anim-item">
                    <label class="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2 ml-1">Nombre / Nick</label>
                    <input type="text" id="playerName" 
                           class="w-full rounded-2xl px-4 py-3.5 transition-all text-base font-medium"
                           placeholder="Tu usuario">
                </div>
            </div>

            <div class="pt-2">
                <label class="block text-[11px] font-bold text-zinc-400 uppercase tracking-widest mb-4 ml-1 anim-item">Diamantes</label>
                <div class="grid grid-cols-2 gap-3" id="packageContainer">
                    <!-- Tarjetas inyectadas por JS -->
                </div>
            </div>

            <div class="pt-8 mt-4 border-t border-white/10 anim-item">
                <div class="flex justify-between items-end mb-6 px-1">
                    <span class="text-zinc-400 font-medium">Total a pagar</span>
                    <span class="text-3xl font-bold text-white tracking-tight" id="totalPrice">S/ 0.00</span>
                </div>
                
                <button onclick="processOrder()" class="w-full bg-white text-black hover:bg-zinc-200 active:scale-[0.98] font-bold py-4 rounded-2xl transition-all duration-200 text-lg shadow-[0_0_20px_rgba(255,255,255,0.1)]">
                    Continuar al Pago
                </button>
            </div>
        </div>
    </div>

    <!-- Créditos Finales -->
    <div class="mt-8 z-10 anim-item text-center">
        <p class="text-[11px] text-zinc-500/80 font-medium tracking-[0.2em] uppercase">
            Created by  Lincol Ostos
        </p>
    </div>

    <!-- Modal Glassmorphism -->
    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden items-center justify-center p-4 z-50 opacity-0 transition-opacity duration-300">
        <div class="interfaz-glass p-8 rounded-3xl max-w-sm w-full text-center transform scale-95 transition-transform duration-300" id="modalContent">
            <div id="modalIcon" class="text-4xl mb-4">⚠️</div>
            <h3 id="modalTitle" class="text-xl font-bold mb-2 text-white tracking-tight">Aviso</h3>
            <p id="modalMessage" class="text-zinc-400 text-sm mb-8 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full bg-white/10 text-white hover:bg-white/20 font-semibold py-3 rounded-xl transition-colors border border-white/10">
                Entendido
            </button>
        </div>
    </div>

    <script>
        const packages = [
            { diamonds: 110,  price: 4.50 },
            { diamonds: 341,  price: 10.50 },
            { diamonds: 572,  price: 18.50 },
            { diamonds: 1166, price: 37.50 },
            { diamonds: 2398, price: 75.90 },
            { diamonds: 6160, price: 190.00 }
        ];

        let selectedPackage = null;
        const container = document.getElementById('packageContainer');

        packages.forEach((pkg, index) => {
            const div = document.createElement('div');
            div.className = 'package-card anim-item cursor-pointer rounded-2xl p-5 flex flex-col items-center justify-center relative';
            div.onclick = () => selectPackage(index, div);
            div.innerHTML = `
                <div class="flex items-center justify-center gap-2 mb-1.5">
                    <span class="text-xl">💎</span>
                    <span class="text-white font-bold text-[22px] tracking-tight">${pkg.diamonds}</span>
                </div>
                <span class="text-zinc-400 text-sm font-medium">S/ ${pkg.price.toFixed(2)}</span>
            `;
            container.appendChild(div);
        });

        function selectPackage(index, element) {
            selectedPackage = packages[index];
            document.querySelectorAll('.package-card').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            
            const priceEl = document.getElementById('totalPrice');
            priceEl.innerText = `S/ ${selectedPackage.price.toFixed(2)}`;
            gsap.fromTo(priceEl, { scale: 1.1, color: '#38bdf8' }, { scale: 1, color: '#ffffff', duration: 0.3 });
        }

        function showModal(title, message, icon = '⚠️') {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('modalIcon').innerText = icon;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function processOrder() {
            const id = document.getElementById('playerId').value;
            const name = document.getElementById('playerName').value.trim();

            if (!id || id.length < 8) {
                showModal('ID Inválido', 'El ID de jugador debe tener entre 8 y 12 números.');
                return;
            }
            if (!name) {
                showModal('Datos incompletos', 'Por favor ingresa tu nombre o nickname.');
                return;
            }
            if (!selectedPackage) {
                showModal('Selecciona un paquete', 'Debes elegir la cantidad de diamantes que deseas recargar antes de continuar.');
                return;
            }

            const text = `¡Hola! Quiero realizar una recarga de Free Fire. 💎\n\n` +
                         `*ID:* ${id}\n` +
                         `*Nombre:* ${name}\n` +
                         `*Paquete:* ${selectedPackage.diamonds} Diamantes\n` +
                         `*Total a Pagar:* S/ ${selectedPackage.price.toFixed(2)}\n\n` +
                         `¡Aquí tienes la captura de mi pago! 🧾`;
            
            const targetPhone = "51943621317";
            const whatsappUrl = `https://wa.me/${targetPhone}?text=${encodeURIComponent(text)}`;
            window.open(whatsappUrl, '_blank');
        }

        document.addEventListener('DOMContentLoaded', () => {
            gsap.set('.anim-item', { visibility: 'visible' });
            gsap.fromTo('.anim-item', 
                { y: 20, opacity: 0 }, 
                { y: 0, opacity: 1, duration: 0.6, stagger: 0.08, ease: "power3.out", delay: 0.1 }
            );
        });
    </script>
</body>
</html>
